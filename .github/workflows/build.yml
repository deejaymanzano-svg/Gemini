name: Deploy MAIK MT Studio Web & Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository [Clone Source]
        uses: actions/checkout@v4

      - name: Setup Node.js 22 [Node Runtime]
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 [Android Gradle SDK Requirement]
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Capacitor Android Project & App Icon [Wrapper & Icon Gen]
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          if [ -f logo.png ]; then cp logo.png www/logo.png; fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npm install -D @capacitor/assets sharp
          npx cap init "MAIK MT Studio DSP" "com.maikmt.studiodsp" --web-dir www
          npx cap add android
          if [ -f logo.png ]; then
            node -e '
              const sharp = require("sharp");
              (async () => {
                await sharp("logo.png").resize(1024, 1024, { fit: "cover", position: "center" }).png().toFile("assets/icon.png");
                await sharp("logo.png").resize(2732, 2732, { fit: "contain", background: { r: 7, g: 9, b: 14, alpha: 1 } }).png().toFile("assets/splash.png");
              })();
            '
            npx capacitor-assets generate --android
          fi
          npx cap sync android

      - name: Compile Android Debug APK [Gradle Build]
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MAIK-MT-Studio-DSP.apk

      - name: Upload APK to Actions Artifacts [Artifact Backup]
        uses: actions/upload-artifact@v4
        with:
          name: MAIK-MT-Studio-DSP-APK
          path: MAIK-MT-Studio-DSP.apk

      - name: Publish Direct APK to GitHub Releases [One-Click Mobile Download]
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MAIK MT Studio DSP v1.0.${{ github.run_number }} [Android APK]"
          files: MAIK-MT-Studio-DSP.apk
          prerelease: false

      - name: Upload Web App for GitHub Pages [Web Build]
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy Live Web App [GitHub Pages Publish]
        uses: actions/deploy-pages@v4
